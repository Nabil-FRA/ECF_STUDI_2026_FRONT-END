<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Espace employé — Gestion des commandes du jour.">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace employé — Vite &amp; Gourmand</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/NPq0unNn0lSzMO0kzGHqKO7v5soGqs" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/espace.css">
</head>
<body>

  <a href="#contenu-principal" class="visually-hidden-focusable skip-link">Aller au contenu principal</a>

  <!-- HEADER employé -->
  <header class="site-header" role="banner">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Navigation employé">
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <img src="../images/logo.svg" alt="Vite &amp; Gourmand" height="40">
        </a>
        <span class="badge bg-warning text-dark ms-2">Employé</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#nav-employe" aria-controls="nav-employe" aria-expanded="false"
          aria-label="Menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav-employe">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="espace-employe.html" aria-current="page">
                <i class="bi bi-speedometer2" aria-hidden="true"></i> Tableau de bord
              </a>
            </li>
            <li class="nav-item">
              <button id="btn-deconnexion" class="btn btn-outline-light btn-sm ms-2">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Déconnexion
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main id="contenu-principal" class="container my-4" role="main">

    <h1 class="page-titre mb-4">
      <i class="bi bi-clipboard-check" aria-hidden="true"></i>
      Commandes du jour
    </h1>

    <!-- stats rapides -->
    <div class="row g-3 mb-4" id="stats-jour">
      <div class="col-sm-6 col-lg-3">
        <div class="card text-center stat-card">
          <div class="card-body">
            <div class="stat-nombre" id="stat-total">0</div>
            <div class="stat-label">Total commandes</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card text-center stat-card stat-attente">
          <div class="card-body">
            <div class="stat-nombre" id="stat-attente">0</div>
            <div class="stat-label">En attente</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card text-center stat-card stat-confirmee">
          <div class="card-body">
            <div class="stat-nombre" id="stat-confirmee">0</div>
            <div class="stat-label">Confirmées</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card text-center stat-card stat-livree">
          <div class="card-body">
            <div class="stat-nombre" id="stat-livree">0</div>
            <div class="stat-label">Livrées</div>
          </div>
        </div>
      </div>
    </div>

    <!-- filtre par statut + date -->
    <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
      <label for="filtre-statut" class="form-label mb-0 fw-bold">Filtrer :</label>
      <select id="filtre-statut" class="form-select form-select-sm" style="width: auto;">
        <option value="tous">Tous les statuts</option>
        <option value="En attente">En attente</option>
        <option value="Confirmée">Confirmée</option>
        <option value="En préparation">En préparation</option>
        <option value="Livrée">Livrée</option>
        <option value="Annulée">Annulée</option>
      </select>

      <label for="filtre-date" class="form-label mb-0 ms-3 fw-bold">Date :</label>
      <input type="date" id="filtre-date" class="form-control form-control-sm" style="width: auto;">
    </div>

    <!-- tableau des commandes -->
    <div class="table-responsive">
      <table class="table table-hover align-middle" aria-label="Liste des commandes">
        <thead class="table-dark">
          <tr>
            <th scope="col">N°</th>
            <th scope="col">Client</th>
            <th scope="col">Menu</th>
            <th scope="col">Convives</th>
            <th scope="col">Heure</th>
            <th scope="col">Adresse</th>
            <th scope="col">Total</th>
            <th scope="col">Statut</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="commandes-body">
          <!-- JS injecte les lignes -->
        </tbody>
      </table>
    </div>

    <!-- chargement -->
    <div id="commandes-chargement" class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
    </div>

    <!-- état vide -->
    <div id="commandes-vide" class="text-center py-5 d-none">
      <i class="bi bi-calendar-x display-1 text-muted" aria-hidden="true"></i>
      <p class="mt-3 text-muted">Aucune commande pour cette date.</p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer bg-dark text-light" role="contentinfo">
    <div class="container py-3">
      <p class="text-center small mb-0">
        &copy; 2026 Vite &amp; Gourmand — Espace employé
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="../JS/espace-employe.js"></script>
</body>
</html>
