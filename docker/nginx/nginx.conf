# ============================================
# Nginx — Configuration Front-end statique
# Vite & Gourmand — ECF 2026
# ============================================

server {
    listen 80;
    server_name localhost;

    # Répertoire racine des fichiers statiques
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # COMPRESSION GZIP
    # ============================================
    gzip on;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ============================================
    # EN-TÊTES DE SÉCURITÉ
    # (equivalents aux headers Netlify netlify.toml)
    # ============================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ============================================
    # PAGE D'ACCUEIL
    # ============================================
    location = / {
        try_files /index.html =404;
    }

    # ============================================
    # PAGES (sous-dossier /pages/)
    # ============================================
    location /pages/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # ============================================
    # ASSETS STATIQUES (CSS, JS, images, fonts)
    # ============================================
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # FICHIERS STATIQUES DIVERS
    # ============================================
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache";
    }

    # ============================================
    # SÉCURITÉ : bloquer les fichiers sensibles
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|md|toml|sql|log|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # PAGE 404 PERSONNALISÉE
    # ============================================
    error_page 404 /index.html;

    # ============================================
    # LOGS
    # ============================================
    access_log /var/log/nginx/frontend_access.log;
    error_log  /var/log/nginx/frontend_error.log warn;
}
